name: Create release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Seeds the image for a version before its tag exists: action.yml at that tag
  # pins `docker://ghcr.io/...:<version>`, so every release dispatches this
  # first, then pushes the tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Publish only the container image for this version (e.g. v1.2.0). No GitHub release is created."
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: somaz94/.github/.github/workflows/release-reusable.yml@main
    permissions:
      contents: write
      pull-requests: write
      packages: write
    with:
      image_tag: ${{ inputs.image_tag || '' }}
    secrets: inherit
