name: Backup GitHub to GitLab

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/*
  workflow_dispatch:

# One-way push to GitLab: checkout is the only GitHub-side need.
permissions:
  contents: read

# No cancel-in-progress: force-pushing `--all` is non-atomic, so an
# interrupted run leaves GitLab with partial refs.
concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror to GitLab
        uses: somaz94/multi-git-mirror@v1
        with:
          targets: |
            gitlab::https://gitlab.com/backup6695808/compress-decompress.git
          gitlab_token: ${{ secrets.GITLAB_TOKEN }}
          mirror_branches: 'all'
          mirror_tags: 'true'
          force_push: 'true'
          # GitLab.com occasionally declines a push with an empty pre-receive
          # message (an internal timeout, not a rule violation); retry it.
          retry_count: '2'
