name: Smoke Test (Released Action)

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'workflow run'
        required: true
        default: 'true'
  workflow_run:
    workflows: ["Create release"]
    types:
      - completed

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke Test (${{ matrix.format }}, root=${{ matrix.include_root }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `Create release` fires twice per release: once as workflow_dispatch, which
    # only seeds the container image while the tag does not exist yet, and once
    # on the tag push that actually publishes the release. Smoke-testing the
    # first one resolves `@v1` to the PREVIOUS version, so every release left a
    # failing run behind. Only the tag-push run is a released action.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    strategy:
      matrix:
        format: [zip, tar, tgz, tbz2, txz, tzst]
        include_root: [true, false]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Test Files
        run: |
          mkdir -p testdir/subdir
          echo "Hello World" > testdir/file.txt
          echo "Nested file" > testdir/subdir/nested.txt

      - name: Compress
        id: compress
        uses: somaz94/compress-decompress@v1
        with:
          command: 'compress'
          source: './testdir'
          format: ${{ matrix.format }}
          includeRoot: ${{ matrix.include_root }}
          verbose: 'true'

      - name: Set Archive Path
        id: archive
        run: |
          if [ "${{ matrix.include_root }}" = "true" ]; then
            echo "path=./testdir.${{ matrix.format }}" >> $GITHUB_OUTPUT
          else
            echo "path=./testdir/testdir.${{ matrix.format }}" >> $GITHUB_OUTPUT
          fi

      - name: Verify Archive Created
        run: |
          if [ ! -f "${{ steps.archive.outputs.path }}" ]; then
            echo "❌ Archive not found: ${{ steps.archive.outputs.path }}"
            exit 1
          fi
          echo "✅ Archive created: ${{ steps.archive.outputs.path }}"

      - name: Verify Outputs
        # Read through env rather than interpolating into the script: a value
        # carrying a quote or a newline would otherwise break the shell parse.
        env:
          FILE_PATH: ${{ steps.compress.outputs.file_path }}
          CHECKSUM: ${{ steps.compress.outputs.checksum }}
          ORIGINAL_SIZE: ${{ steps.compress.outputs.original_size }}
          COMPRESSED_SIZE: ${{ steps.compress.outputs.compressed_size }}
          COMPRESSION_RATIO: ${{ steps.compress.outputs.compression_ratio }}
          FILE_COUNT: ${{ steps.compress.outputs.file_count }}
          DURATION: ${{ steps.compress.outputs.duration }}
        run: |
          set -euo pipefail
          for key in FILE_PATH CHECKSUM ORIGINAL_SIZE COMPRESSED_SIZE \
                     COMPRESSION_RATIO FILE_COUNT DURATION; do
            [ -n "${!key}" ] || { echo "❌ empty output: $key"; exit 1; }
            echo "✅ $key=${!key}"
          done
          [ "$FILE_COUNT" = "2" ] || { echo "❌ unexpected file_count: $FILE_COUNT"; exit 1; }

      - name: Decompress
        uses: somaz94/compress-decompress@v1
        with:
          command: 'decompress'
          source: ${{ steps.archive.outputs.path }}
          format: ${{ matrix.format }}
          dest: './extracted'
          verify_checksum: ${{ steps.compress.outputs.checksum }}

      - name: Verify Extraction
        run: |
          if [ "${{ matrix.include_root }}" = "true" ]; then
            EXPECTED="./extracted/testdir/file.txt"
          else
            EXPECTED="./extracted/file.txt"
          fi

          if [ -f "$EXPECTED" ]; then
            echo "✅ Decompression verified: $EXPECTED"
          else
            echo "❌ Expected file not found: $EXPECTED"
            echo "Actual contents:"
            find ./extracted -type f | sort
            exit 1
          fi
