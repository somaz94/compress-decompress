name: "Compress/Decompress"
description:
  "Compress and decompress files in CI/CD: password-protected zip, SHA256 checksum,
  job summary, and 6 archive formats (zip, tar, tgz, tbz2, txz, tzst)."
author: "somaz94"
inputs:
  command:
    description: 'Command to perform ("compress" or "decompress").'
    required: true
  source:
    description: "Source directory, file, or glob pattern to compress or decompress. Supports glob patterns like **/*.doc to match multiple files."
    required: true
  dest:
    description: "Destination directory for the output."
    required: false
  destfilename:
    description: "Destination filename for the compressed output."
    required: false
  dedupeExtension:
    description: "When destfilename already ends with the format extension, do not append it a second time, so 'archive.zip' yields archive.zip. Set to false to always append, restoring the previous archive.zip.zip behavior."
    required: false
    default: "true"
  exclude:
    description: "File(s) to exclude from compression process."
    required: false
  format:
    description:
      "Compression format to use. Supported formats: zip, tar, tgz, tbz2, txz, tzst."
    required: true
  includeRoot:
    description: "Whether to include the root folder itself in the compressed file."
    required: false
    default: "true"
  includeHidden:
    description: "Whether to include dotfiles (.env, .git, .github, and nested ones) in the archive. Set to false to leave every hidden file out, across all formats."
    required: false
    default: "true"
  preserveGlobStructure:
    description: "When using glob patterns, preserve the directory structure in the archive. If false, all matched files are flattened to the root level."
    required: false
    default: "false"
  stripPrefix:
    description: "Remove this prefix from file paths when preserving directory structure. Works only with glob patterns and preserveGlobStructure: true. Example: 'src/' will change 'src/app/main.py' to 'app/main.py' in the archive."
    required: false
    default: ""
  fail_on_error:
    description: "Whether to fail the action if compression/decompression fails."
    required: false
    default: "true"
  compression_level:
    description: "Compression level (0-9). 0 is store only, 9 is maximum compression. Applies to zip, tgz, tbz2, txz, and tzst formats."
    required: false
    default: ""
  password:
    description: "Password for zip encryption/decryption. Use with secrets for security. Only applies to zip format."
    required: false
    default: ""
  verbose:
    description: "Enable verbose logging for debugging."
    required: false
    default: "false"
  verify_checksum:
    description: "Expected SHA256 of the archive. Decompression aborts before extracting anything when it does not match. Decompress only."
    required: false
    default: ""
  path_traversal_check:
    description: "Reject archives whose entries would extract outside the destination directory (zip slip). Decompress only."
    required: false
    default: "true"
  step_summary:
    description: "Write a result table to the workflow job summary ($GITHUB_STEP_SUMMARY)."
    required: false
    default: "true"
outputs:
  file_path:
    description: "The path to the compressed or decompressed file."
  checksum:
    description: "SHA256 checksum of the compressed archive (compress only)."
  original_size:
    description: "Size in bytes of the source (compress) or of the archive (decompress)."
  compressed_size:
    description: "Size in bytes of the produced archive (compress only)."
  compression_ratio:
    description: "Percentage of the original size saved, e.g. \"75.0\" (compress only)."
  file_count:
    description: "Number of files compressed, or entries extracted."
  duration:
    description: "Seconds the operation took, e.g. \"1.42\"."
runs:
  using: "docker"
  # A prebuilt image, not `Dockerfile`: building it on every consumer run cost
  # 31s, pulling costs a few. ci.yml still builds the Dockerfile on every PR.
  # Two deliberate trade-offs:
  #   1. The image must exist before the tag, so every release seeds it through
  #      release.yml's workflow_dispatch and only then pushes the tag.
  #   2. A registry reference resolves only to what was pushed, so the image is
  #      published linux/amd64 + linux/arm64 for arm64 runners.
  image: docker://ghcr.io/somaz94/compress-decompress:v1.15.1
  env:
    COMMAND: ${{ inputs.command }}
    SOURCE: ${{ inputs.source }}
    DEST: ${{ inputs.dest }}
    DESTFILENAME: ${{ inputs.destfilename }}
    DEDUPE_EXTENSION: ${{ inputs.dedupeExtension }}
    EXCLUDE: ${{ inputs.exclude }}
    FORMAT: ${{ inputs.format }}
    INCLUDEROOT: ${{ inputs.includeRoot }}
    INCLUDE_HIDDEN: ${{ inputs.includeHidden }}
    PRESERVE_GLOB_STRUCTURE: ${{ inputs.preserveGlobStructure }}
    STRIP_PREFIX: ${{ inputs.stripPrefix }}
    FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
    COMPRESSION_LEVEL: ${{ inputs.compression_level }}
    PASSWORD: ${{ inputs.password }}
    VERBOSE: ${{ inputs.verbose }}
    VERIFY_CHECKSUM: ${{ inputs.verify_checksum }}
    PATH_TRAVERSAL_CHECK: ${{ inputs.path_traversal_check }}
    STEP_SUMMARY: ${{ inputs.step_summary }}
branding:
  icon: "archive"
  color: "blue"
