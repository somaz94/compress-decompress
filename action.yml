name: "Compress/Decompress"
description:
  "Compress and decompress files in CI/CD: password-protected zip, SHA256 checksum,
  and 5 archive formats (zip, tar, tgz, tbz2, txz)."
author: "somaz94"
inputs:
  command:
    description: 'Command to perform ("compress" or "decompress").'
    required: true
  source:
    description: "Source directory, file, or glob pattern to compress or decompress. Supports glob patterns like **/*.doc to match multiple files."
    required: true
  dest:
    description: "Destination directory for the output."
    required: false
  destfilename:
    description: "Destination filename for the compressed output."
    required: false
  exclude:
    description: "File(s) to exclude from compression process."
    required: false
  format:
    description:
      "Compression format to use. Supported formats: zip, tar, tgz, tbz2, txz."
    required: true
  includeRoot:
    description: "Whether to include the root folder itself in the compressed file."
    required: false
    default: "true"
  preserveGlobStructure:
    description: "When using glob patterns, preserve the directory structure in the archive. If false, all matched files are flattened to the root level."
    required: false
    default: "false"
  stripPrefix:
    description: "Remove this prefix from file paths when preserving directory structure. Works only with glob patterns and preserveGlobStructure: true. Example: 'src/' will change 'src/app/main.py' to 'app/main.py' in the archive."
    required: false
    default: ""
  fail_on_error:
    description: "Whether to fail the action if compression/decompression fails."
    required: false
    default: "true"
  compression_level:
    description: "Compression level (0-9). 0 is store only, 9 is maximum compression. Applies to zip, tgz, tbz2, and txz formats."
    required: false
    default: ""
  password:
    description: "Password for zip encryption/decryption. Use with secrets for security. Only applies to zip format."
    required: false
    default: ""
  verbose:
    description: "Enable verbose logging for debugging."
    required: false
    default: "false"
outputs:
  file_path:
    description: "The path to the compressed or decompressed file."
  checksum:
    description: "SHA256 checksum of the compressed archive (compress only)."
runs:
  using: "docker"
  # A prebuilt image rather than `Dockerfile`. With `Dockerfile`, every consumer
  # workflow builds this image before the action can start — measured at 31s per
  # run. Pulling costs a few seconds.
  #
  # The Dockerfile is still the source this image is built from, and ci.yml
  # keeps building it on every pull request, so the build path cannot rot.
  #
  # Two things this trades away, both deliberate:
  #   1. The tag must not be pushed before the image exists. release.yml
  #      publishes the image in a job the release job depends on, and the very
  #      first version is seeded by hand via its workflow_dispatch.
  #   2. `Dockerfile` built for whatever architecture the runner was; a registry
  #      reference resolves only to what was pushed. The image is published
  #      linux/amd64 + linux/arm64 so arm64 runners keep working.
  image: docker://ghcr.io/somaz94/compress-decompress:v1.11.0
  env:
    COMMAND: ${{ inputs.command }}
    SOURCE: ${{ inputs.source }}
    DEST: ${{ inputs.dest }}
    DESTFILENAME: ${{ inputs.destfilename }}
    EXCLUDE: ${{ inputs.exclude }}
    FORMAT: ${{ inputs.format }}
    INCLUDEROOT: ${{ inputs.includeRoot }}
    PRESERVE_GLOB_STRUCTURE: ${{ inputs.preserveGlobStructure }}
    STRIP_PREFIX: ${{ inputs.stripPrefix }}
    FAIL_ON_ERROR: ${{ inputs.fail_on_error }}
    COMPRESSION_LEVEL: ${{ inputs.compression_level }}
    PASSWORD: ${{ inputs.password }}
    VERBOSE: ${{ inputs.verbose }}
branding:
  icon: "archive"
  color: "blue"
